<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BJNFC</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#222;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh; /* Centers the container vertically and horizontally */
    overflow:hidden;  /* Prevents scrollbars */
}

.container{
    position:relative;
    display:inline-block; /* Shrinks container to match the exact rendered size of the image */
    max-width:100vw;
    max-height:100vh;
}

.container img{
    display:block;
    max-width:100vw;
    max-height:100vh;
    width:auto;
    height:100vh;      /* Forces image to fit the screen height */
    object-fit:contain;
}

/* Facebook Click Area */
.facebook{
    position:absolute;
    left:13%;
    top:67%;
    width:74%;
    height:10%;
}

/* Instagram Click Area */
.instagram{
    position:absolute;
    left:13%;
    top:82%;
    width:74%;
    height:10%;
}
</style>

</head>

<body>

<div class="container">
    <img src="NFC .png" alt="BJNFC">

    <a class="facebook"
       href="https://www.facebook.com/profile.php?id=61591063966426"
       target="_blank">
    </a>

    <a class="instagram"
       href="https://www.instagram.com/cc.beejy/"
       target="_blank">
    </a>
</div>

</body>
</html>
